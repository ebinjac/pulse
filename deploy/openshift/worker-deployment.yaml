apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-worker
  labels:
    app: pulse-worker
    app.kubernetes.io/part-of: pulse
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pulse-worker
  template:
    metadata:
      labels:
        app: pulse-worker
    spec:
      containers:
        - name: worker
          image: pulse-api:latest
          imagePullPolicy: Always
          command: ["/app/pulse-worker"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pulse-backend
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: pulse-backend
                  key: REDIS_URL
            - name: PULSE_SECRET_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: pulse-backend
                  key: PULSE_SECRET_ENCRYPTION_KEY
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 1Gi
