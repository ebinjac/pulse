# Example only — replace values via your secret manager or:
#   oc create secret generic pulse-backend --from-literal=...
#
# Do not apply this file with real credentials committed to git.
apiVersion: v1
kind: Secret
metadata:
  name: pulse-backend
  labels:
    app.kubernetes.io/part-of: pulse
type: Opaque
stringData:
  DATABASE_URL: "postgres://USER:PASSWORD@postgres.example.com:5432/pulse?sslmode=require"
  REDIS_URL: "redis://:PASSWORD@redis.example.com:6379/0"
  PULSE_SECRET_ENCRYPTION_KEY: "replace-with-openssl-rand-base64-32"
---
apiVersion: v1
kind: Secret
metadata:
  name: pulse-web
  labels:
    app.kubernetes.io/part-of: pulse
type: Opaque
stringData:
  PULSE_API_BASE_URL: "http://pulse-api:8080"
