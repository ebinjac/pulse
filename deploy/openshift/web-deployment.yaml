apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-web
  labels:
    app: pulse-web
    app.kubernetes.io/part-of: pulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pulse-web
  template:
    metadata:
      labels:
        app: pulse-web
    spec:
      containers:
        - name: web
          image: pulse-web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: PULSE_API_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: pulse-web
                  key: PULSE_API_BASE_URL
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: pulse-web
  labels:
    app: pulse-web
    app.kubernetes.io/part-of: pulse
spec:
  selector:
    app: pulse-web
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: pulse-web
  labels:
    app: pulse-web
    app.kubernetes.io/part-of: pulse
spec:
  to:
    kind: Service
    name: pulse-web
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
