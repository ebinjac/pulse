services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pulse
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
    ports:
      - "5432:5432"
    volumes:
      - pulse-postgres:/var/lib/postgresql/data
      - ./apps/api/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PULSE_API_ADDR: ":8080"
      DATABASE_URL: postgres://pulse:pulse@postgres:5432/pulse?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      PULSE_SECRET_ENCRYPTION_KEY: ZW5zZW1ibGUtcHVsc2UtbG9jYWwtZGV2LWtleS0wMSE=
      PULSE_ALERT_SLACK_WEBHOOK_URL: ""
      PULSE_ALERT_SMTP_ADDR: ""
      PULSE_ALERT_SMTP_USER: ""
      PULSE_ALERT_SMTP_PASSWORD: ""
      PULSE_ALERT_EMAIL_FROM: ""
      PULSE_ALERT_EMAIL_TO: ""
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pulse-postgres:
