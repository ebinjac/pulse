version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "migrations/000001_initial_schema.up.sql"
      - "migrations/000002_compatibility_patches.up.sql"
      - "migrations/000003_applications.up.sql"
      - "migrations/000004_step_timing.up.sql"
      - "migrations/000005_monitor_versions.up.sql"
      - "migrations/000006_alert_routing_ops.up.sql"
      - "migrations/000007_system_settings.up.sql"
      - "migrations/000008_certificate_profiles.up.sql"
      - "migrations/000009_deployment_validations.up.sql"
      - "migrations/000010_deployment_validation_sampling.up.sql"
      - "migrations/000011_deployment_validation_baseline.up.sql"
      - "migrations/000012_elf_integration.up.sql"
      - "migrations/000013_elf_observability.up.sql"
      - "migrations/000014_log_index_pattern.up.sql"
      - "migrations/000015_clear_legacy_elf_index_default.up.sql"
    queries: "internal/db/queries"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: false
        emit_empty_slices: true
